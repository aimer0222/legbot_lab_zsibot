seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 50000
empirical_normalization: false
obs_groups:
  policy:
  - policy
  critic:
  - critic
clip_actions: 10.0
save_interval: 50
experiment_name: zsl1w_piper_fixed_moe_cts
run_name: zsl1w_v1
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunnerCTS
policy:
  class_name: ActorCriticMoECTS
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_obs_normalization: {}
  critic_obs_normalization: {}
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  expert_num: 8
  latent_dim: 32
  norm_type: l2norm
  teacher_encoder_hidden_dims:
  - 512
  - 256
  student_encoder_hidden_dims:
  - 512
  - 256
  - 256
algorithm:
  class_name: MoECTS
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
  load_balance_coef: 0.01
  student_encoder_learning_rate: 0.001
  betas: !!python/tuple
  - 0.9
  - 0.999
  weight_decay: 0.0
  teacher_env_ratio: 0.75
stall_timeout: 0
robogauge:
  enabled: false
  port: 9973
